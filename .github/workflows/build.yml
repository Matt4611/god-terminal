name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Typecheck, test, build and package
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Clean previous release output
        shell: pwsh
        run: Remove-Item -Recurse -Force release -ErrorAction SilentlyContinue

      - name: Package Windows installer
        run: npm run dist:ci
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify installer
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = Join-Path "release" "God Terminal Setup $version.exe"
          if (-not (Test-Path $installer)) {
            throw "Installer not found: $installer"
          }
          $size = (Get-Item $installer).Length
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          "Installer: ``$installer``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Size: $size bytes" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "SHA-256: ``$hash``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: god-terminal-windows
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14
